<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>lcp_hud_v4</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="hidden">
    <!-- ===========================================================
         HUD elements. Each is positioned absolutely; the editor
         drags them around the viewport. Every element has the
         `hud-element` class so the editor can pick them up.
         =========================================================== -->

    <div class="hud-element" id="el-status" data-key="status">
      <!-- Dual-circle layout (default) -->
      <div class="status-circles" data-style="circles">
        <div class="status-ring status-ring--food-water" data-ring="food-water">
          <svg viewBox="0 0 200 200" class="ring-svg">
            <!-- background -->
            <circle cx="100" cy="100" r="86" class="ring-bg" />
            <!-- hunger (left half, pink) -->
            <path class="ring-arc ring-arc--hunger"
                  d="M100,14 A86,86 0 0,0 100,186"
                  pathLength="100" />
            <!-- thirst (right half, blue) -->
            <path class="ring-arc ring-arc--thirst"
                  d="M100,14 A86,86 0 0,1 100,186"
                  pathLength="100" />
            <!-- center icons + values -->
            <g class="ring-center-group">
              <text x="62"  y="105" class="ring-value" id="val-hunger">100</text>
              <text x="138" y="105" class="ring-value" id="val-thirst">100</text>
            </g>
          </svg>
          <div class="ring-icons">
            <div class="ring-icon ring-icon--left"  title="Hunger">
              <svg viewBox="0 0 24 24"><use href="#icon-hunger"/></svg>
            </div>
            <div class="ring-icon ring-icon--right" title="Durst">
              <svg viewBox="0 0 24 24"><use href="#icon-thirst"/></svg>
            </div>
          </div>
        </div>

        <div class="status-ring status-ring--health-armor" data-ring="health-armor">
          <svg viewBox="0 0 200 200" class="ring-svg">
            <circle cx="100" cy="100" r="86" class="ring-bg" />
            <path class="ring-arc ring-arc--health"
                  d="M100,14 A86,86 0 0,0 100,186"
                  pathLength="100" />
            <path class="ring-arc ring-arc--armor"
                  d="M100,14 A86,86 0 0,1 100,186"
                  pathLength="100" />
            <g class="ring-center-group">
              <text x="62"  y="105" class="ring-value" id="val-health">100</text>
              <text x="138" y="105" class="ring-value" id="val-armor">0</text>
            </g>
          </svg>
          <div class="ring-icons">
            <div class="ring-icon ring-icon--left"  title="Leben">
              <svg viewBox="0 0 24 24"><use href="#icon-health"/></svg>
            </div>
            <div class="ring-icon ring-icon--right" title="Rüstung">
              <svg viewBox="0 0 24 24"><use href="#icon-armor"/></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Row layout: individual chips. Hidden unless data-style="row". -->
      <div class="status-row" data-style="row">
        <div class="chip chip--health">
          <div class="chip-icon"><svg viewBox="0 0 24 24"><use href="#icon-health"/></svg></div>
          <div class="chip-bar"><div class="chip-bar-fill" id="row-health-fill"></div></div>
          <div class="chip-value" id="row-health-val">100</div>
        </div>
        <div class="chip chip--armor">
          <div class="chip-icon"><svg viewBox="0 0 24 24"><use href="#icon-armor"/></svg></div>
          <div class="chip-bar"><div class="chip-bar-fill" id="row-armor-fill"></div></div>
          <div class="chip-value" id="row-armor-val">0</div>
        </div>
        <div class="chip chip--hunger">
          <div class="chip-icon"><svg viewBox="0 0 24 24"><use href="#icon-hunger"/></svg></div>
          <div class="chip-bar"><div class="chip-bar-fill" id="row-hunger-fill"></div></div>
          <div class="chip-value" id="row-hunger-val">100</div>
        </div>
        <div class="chip chip--thirst">
          <div class="chip-icon"><svg viewBox="0 0 24 24"><use href="#icon-thirst"/></svg></div>
          <div class="chip-bar"><div class="chip-bar-fill" id="row-thirst-fill"></div></div>
          <div class="chip-value" id="row-thirst-val">100</div>
        </div>
      </div>
    </div>

    <div class="hud-element" id="el-voice" data-key="voice">
      <div class="voice" data-mode="normal">
        <div class="voice-icon">
          <svg viewBox="0 0 24 24"><use href="#icon-voice"/></svg>
        </div>
        <div class="voice-text">
          <span class="voice-mode" id="voice-mode">Normal</span>
          <span class="voice-distance" id="voice-distance">7.5m</span>
        </div>
      </div>
    </div>

    <div class="hud-element" id="el-ammo" data-key="ammo">
      <div class="ammo" id="ammo-root">
        <div class="ammo-icon">
          <svg viewBox="0 0 24 24"><use href="#icon-ammo"/></svg>
        </div>
        <div class="ammo-text">
          <span id="ammo-current">0</span>
          <span class="ammo-sep">/</span>
          <span id="ammo-max">0</span>
        </div>
      </div>
    </div>

    <div class="hud-element" id="el-job" data-key="job">
      <div class="job">
        <div class="job-icon"><svg viewBox="0 0 24 24"><use href="#icon-user"/></svg></div>
        <div class="job-text">
          <span class="job-label" id="job-label">Unemployed</span>
          <span class="job-grade" id="job-grade"></span>
        </div>
      </div>
    </div>

    <div class="hud-element" id="el-playerid" data-key="playerid">
      <div class="pid">
        <span class="pid-tag">ID</span>
        <span class="pid-value" id="pid-value">-</span>
      </div>
    </div>

    <!-- ===========================================================
         Editor overlay
         =========================================================== -->
    <div id="editor" class="editor hidden">
      <div class="editor-panel">
        <header class="editor-header">
          <h1>HUD Editor</h1>
          <button class="editor-close" id="editor-close" title="Schließen">×</button>
        </header>

        <section class="editor-section">
          <div class="editor-row">
            <label>Status-Stil</label>
            <div class="seg">
              <button class="seg-btn" data-style="circles">Kreise</button>
              <button class="seg-btn" data-style="row">Reihe</button>
            </div>
          </div>
          <p class="editor-hint">Ziehe Elemente direkt im Bild an die gewünschte Position. Halte <kbd>Shift</kbd> zum Snapping deaktivieren.</p>
        </section>

        <section class="editor-section">
          <h2>Elemente</h2>
          <ul class="editor-list" id="editor-list">
            <!-- populated by JS -->
          </ul>
        </section>

        <footer class="editor-footer">
          <button class="btn btn-secondary" id="editor-reset">Alles zurücksetzen</button>
          <button class="btn btn-primary"   id="editor-save">Speichern &amp; schließen</button>
        </footer>
      </div>
    </div>

    <!-- ===========================================================
         SVG sprite. Inline so no extra resource ticks.
         =========================================================== -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="icon-hunger" viewBox="0 0 24 24">
          <path fill="currentColor" d="M11 2c-3 0-6 3-6 6 0 2 1 4 2 5l-1 8a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l-1-8c1-1 2-3 2-5 0-3-3-6-6-6Z"/>
        </symbol>
        <symbol id="icon-thirst" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 2c-3 4-6 8-6 12a6 6 0 0 0 12 0c0-4-3-8-6-12Z"/>
        </symbol>
        <symbol id="icon-health" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 21s-7-4.6-9.3-9.1C1 8.4 3.4 4 7.3 4c1.9 0 3.4.9 4.7 2.4C13.3 4.9 14.8 4 16.7 4c3.9 0 6.3 4.4 4.6 7.9C19 16.4 12 21 12 21Z"/>
        </symbol>
        <symbol id="icon-armor" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 2 4 5v6c0 5 3.5 9.4 8 11 4.5-1.6 8-6 8-11V5l-8-3Z"/>
        </symbol>
        <symbol id="icon-voice" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm-7 9a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2a5 5 0 0 1-10 0H5Z"/>
        </symbol>
        <symbol id="icon-ammo" viewBox="0 0 24 24">
          <path fill="currentColor" d="M4 8h2V6h2v2h2v2H8v8H6v-8H4V8Zm10-4h6v16h-2v-2h-2v2h-2V4Zm2 2v3h2V6h-2Zm0 5v3h2v-3h-2Z"/>
        </symbol>
        <symbol id="icon-user" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6Z"/>
        </symbol>
        <symbol id="icon-shield" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 2 4 5v6c0 5 3.5 9.4 8 11 4.5-1.6 8-6 8-11V5l-8-3Z"/>
        </symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24">
          <path fill="currentColor" d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7V4Z"/>
        </symbol>
        <symbol id="icon-wrench" viewBox="0 0 24 24">
          <path fill="currentColor" d="M21 6.5 17.5 10 14 6.5l3.5-3.5a5 5 0 1 0-5 7L4 18.5 5.5 20 14 11.5a5 5 0 0 0 7-5Z"/>
        </symbol>
        <symbol id="icon-car" viewBox="0 0 24 24">
          <path fill="currentColor" d="M5 11 6.5 6h11L19 11h1a2 2 0 0 1 2 2v4h-2a2 2 0 1 1-4 0H8a2 2 0 1 1-4 0H2v-4a2 2 0 0 1 2-2h1Z"/>
        </symbol>
      </defs>
    </svg>

    <script src="script.js"></script>
  </body>
</html>
