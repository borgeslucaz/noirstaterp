<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noir Taxi HUD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="main.css" />
</head>
<body>
    <div id="root">
        <aside class="taxi-hud" id="taxi-hud" hidden aria-live="polite">
            <div class="taxi-stack">

                <!-- Taxímetro -->
                <section class="taxi-panel meter" id="meter" data-state="HIDDEN">
                    <header class="meter__header">
                        <span class="meter__brand">TAXI</span>
                        <span class="meter__sep" aria-hidden="true">·</span>
                        <span class="meter__status" id="meter-status">DISPONÍVEL</span>
                    </header>

                    <!-- AVAILABLE / PAUSED / HIRED -->
                    <div class="meter__body meter__body--meter" id="body-meter">
                        <div class="meter__col">
                            <span class="data-label">TARIFA</span>
                            <span class="fare" id="meter-fare">$0,00</span>
                        </div>
                        <div class="meter__col meter__col--right">
                            <span class="data-label">DISTÂNCIA</span>
                            <span class="distance" id="meter-distance">0,0 km</span>
                        </div>
                    </div>
                    <div class="meter__sub" id="meter-sub">AGUARDANDO CHAMADA</div>

                    <!-- OFFER -->
                    <div class="meter__body meter__body--offer" id="body-offer" hidden>
                        <div class="row"><span class="data-label">ORIGEM</span><span class="value truncate" id="offer-origin">—</span></div>
                        <div class="row"><span class="data-label">ATÉ A COLETA</span><span class="value" id="offer-distance">—</span></div>
                        <div class="row"><span class="data-label">ESTIMATIVA</span><span class="value value--accent" id="offer-estimate">—</span></div>
                        <div class="offer__accept">
                            <span class="key-hint"><kbd id="key-accept">E</kbd> ACEITAR</span>
                            <span class="countdown" id="offer-countdown">10 s</span>
                        </div>
                    </div>

                    <!-- EN_ROUTE / BOARDING -->
                    <div class="meter__body meter__body--route" id="body-route" hidden>
                        <div class="row"><span class="data-label">COLETA</span><span class="value truncate" id="route-origin">—</span></div>
                        <div class="route__distance" id="route-distance">—</div>
                    </div>

                    <!-- COMPLETING (resultado) -->
                    <div class="meter__body meter__body--result" id="body-result" hidden>
                        <div class="row"><span class="data-label">TARIFA</span><span class="value value--accent" id="result-fare">$0</span></div>
                        <div class="row"><span class="data-label">REPUTAÇÃO</span><span class="value" id="result-rep">+0</span></div>
                    </div>
                </section>

                <!-- Ar-condicionado -->
                <section class="taxi-panel climate" id="climate">
                    <span class="climate__temp"><span class="climate__icon" id="climate-icon" aria-hidden="true">❄</span> <span id="climate-value">21°C</span></span>
                    <span class="climate__fan">
                        <span class="data-label">FAN</span>
                        <span class="fan-dots" id="fan-dots" aria-label="FAN nível 0">
                            <i></i><i></i><i></i><i></i><i></i>
                        </span>
                    </span>
                </section>

                <!-- Status do passageiro -->
                <section class="passenger" id="passenger" data-mood="none">
                    <span class="passenger__dot" aria-hidden="true"></span>
                    <span class="data-label">PASSAGEIRO</span>
                    <span class="passenger__label" id="passenger-label">SEM PASSAGEIRO</span>
                </section>

                <!-- Dicas de tecla -->
                <footer class="hints">
                    <span class="hint"><kbd id="key-fan">G</kbd> para alterar a FAN</span>
                    <span class="hint hint--secondary" id="hint-pause"><kbd id="key-pause">J</kbd> pausar chamadas</span>
                </footer>
            </div>
        </aside>
    </div>
    <script src="app.js"></script>
</body>
</html>
