<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="only light">
    <title>Burner Phone</title>
    <style>
        html, body { background-color: rgba(0, 0, 0, 0) !important; }
        .phone[hidden] { display: none !important; }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="phone" hidden aria-label="Telefone descartável" aria-hidden="true">
        <div class="phone-hardware" aria-hidden="true"><span class="speaker"></span></div>
        <section class="phone-screen">
            <header class="status-bar" aria-label="Status do aparelho">
                <svg class="signal-icon" viewBox="0 0 20 14" role="img" aria-label="Sinal"><path d="M1 13h2V9H1v4Zm4 0h2V6H5v7Zm4 0h2V3H9v10Zm4 0h2V0h-2v13Z"/></svg>
                <svg class="battery-icon" viewBox="0 0 26 14" role="img" aria-label="Bateria"><path d="M1 2h21v10H1V2Zm22 3h2v4h-2V5ZM3 4v6h15V4H3Z"/></svg>
            </header>

            <div class="app-shell">
                <section id="home-page" class="page active" aria-label="Aplicativos">
                    <div class="app-list">
                        <button class="app-tile" data-page="illegal" type="button">
                            <span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 4 2.2 4h9.6L19 4l3 7v7l-4.2 3-3-2.8H9.2L6.2 21 2 18v-7l3-7Zm3.3 7a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4Zm7.4 0a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4Z"/></svg></span>
                            <span class="app-label">Venda de rua</span>
                        </button>
                        <button class="app-tile" data-page="contracts" type="button">
                            <span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6V2Zm8 1.5V8h4.5L14 3.5ZM8 12h8v1.6H8V12Zm0 4h8v1.6H8V16Zm0-8h4v1.6H8V8Z"/></svg></span>
                            <span class="app-label">Contratos</span>
                        </button>
                        <button id="close-phone" class="app-tile close-tile" type="button">
                            <span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M11 1h2v11h-2V1Zm5.8 3.1 1.5-1.5A10 10 0 1 1 5.7 2.6l1.5 1.5a8 8 0 1 0 9.6 0Z"/></svg></span>
                            <span class="app-label">Fechar</span>
                        </button>
                    </div>
                </section>

                <section id="contracts-page" class="page" aria-label="Contratos" hidden>
                    <button class="back-link" data-page="home" type="button">‹ contratos</button>
                    <div class="contract-sections">
                        <section class="contract-section" data-section="active">
                            <button class="section-title" type="button" aria-expanded="true" aria-controls="active-contracts" data-toggle="active">
                                <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5.5 8 10.5l5-5-1.2-1.2L8 8.1 4.2 4.3 3 5.5Z"/></svg>
                                <span>Contratos ativos</span>
                            </button>
                            <div id="active-contracts" class="contract-list" role="list"></div>
                        </section>
                        <section class="contract-section" data-section="available">
                            <button class="section-title" type="button" aria-expanded="true" aria-controls="available-contracts" data-toggle="available">
                                <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5.5 8 10.5l5-5-1.2-1.2L8 8.1 4.2 4.3 3 5.5Z"/></svg>
                                <span>Contratos disponíveis</span>
                            </button>
                            <div id="available-contracts" class="contract-list" role="list"></div>
                        </section>
                    </div>
                    <p id="contract-error" class="contract-error" role="alert" hidden></p>
                </section>

                <section id="illegal-page" class="page" aria-label="Atividades ilegais" hidden>
                    <button class="back-link" data-page="home" type="button">‹ atividades</button>
                    <div id="illegal-apps" class="app-list compact-list">
                        <button id="street-activity" class="app-tile" data-page="street" type="button">
                            <span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7l9-5Zm-1 6v6.2l5 2.8 1-1.8-4-2.2V8h-2Z"/></svg></span>
                            <span class="app-label">Venda na rua</span>
                        </button>
                    </div>
                    <p id="no-activities" class="placeholder" hidden>Nenhuma atividade disponível.</p>
                </section>

                <section id="street-page" class="page" aria-label="Venda na rua" hidden>
                    <button class="back-link" data-page="illegal" type="button">‹ venda na rua</button>
                    <p class="placeholder">Ative o canal para procurar compradores próximos.</p>
                    <button id="start-street-sale" class="primary-action" type="button">LIGAR VENDA DE DROGA</button>
                </section>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
