<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="only light">
    <title>Noir Houserobbery</title>
    <style>
        html, body { background-color: rgba(0, 0, 0, 0) !important; }
        #app[hidden] { display: none !important; }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app" hidden aria-hidden="true">
        <section id="checklist" aria-labelledby="checklist-title">
            <header class="checklist-header">
                <span id="checklist-title">Checklist</span>
            </header>
            <ul id="checklist-list" aria-live="polite" aria-atomic="true"></ul>
            <footer class="checklist-footer">Aperte <kbd>J</kbd> para fechar</footer>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
